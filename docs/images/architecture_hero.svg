          <text x="14" y="20" font-family="monospace" font-size="9.5" font-weight="700" fill="#38bdf8">VECTOR PROVENANCE INSPECTOR: src_101_chk_0</text>
          
          <rect x="14" y="30" width="379" height="42" rx="6" fill="#0f172a"/>
          <text x="24" y="46" font-family="-apple-system, sans-serif" font-size="10" font-style="italic" fill="#94a3b8">"Empirical findings confirm error tolerances dropped below 0.003%</text>
          <text x="24" y="60" font-family="-apple-system, sans-serif" font-size="10" font-style="italic" fill="#94a3b8">across 14,000 trials with state graph checkpointing."</text>

          <text x="14" y="90" font-family="monospace" font-size="9" fill="#64748b">URL: https://nist.gov/pqc/2026-report</text>
          <text x="14" y="105" font-family="monospace" font-size="9" fill="#34d399">Start: 0 | End: 492 | Dimensions: 768 | Metric: Cosine</text>
        </g>
      </g>
    </g>

    <!-- Column 3: Claim Verification Matrix & Audit Log (Right) -->
    <g transform="translate(785, 0)">
