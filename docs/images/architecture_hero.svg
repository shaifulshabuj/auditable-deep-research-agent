    <!-- Connector 1 -->
    <path d="M140 125 L140 145" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>

    <!-- Node 2: Web Search & Chunking -->
    <g transform="translate(20, 145)">
      <rect x="0" y="0" width="240" height="85" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="20" r="10" fill="#334155"/>
      <text x="16" y="24" font-family="monospace" font-size="11" font-weight="700" fill="#94a3b8">2</text>
      <text x="40" y="24" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Search &amp; Ingest Workers</text>
      <text x="20" y="46" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">Sliding window chunking (500b)</text>
      <text x="20" y="60" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">Workers AI (BGE 768-dim)</text>
      <text x="20" y="74" font-family="monospace" font-size="9" fill="#38bdf8">→ Cloudflare Vectorize v2</text>
