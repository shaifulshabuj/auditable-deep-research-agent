      <text x="20" y="46" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">Strict inline [[src-X]] citations</text>
      <text x="20" y="62" font-family="monospace" font-size="9" fill="#34d399">Itemizes verifiable claims</text>
    </g>

    <!-- Connector 3 -->
