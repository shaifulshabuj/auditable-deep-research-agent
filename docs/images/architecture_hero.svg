        <text x="341" y="143" font-family="monospace" font-size="9.5" font-weight="700" fill="#6ee7b7">[src:2#1]</text>

        <text x="0" y="162" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">with sub-50ms round-trip query latencies at the edge.</text>

