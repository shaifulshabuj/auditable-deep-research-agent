        <rect x="0" y="0" width="255" height="75" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <circle cx="40" cy="38" r="24" fill="none" stroke="#064e3b" stroke-width="5"/>
        <circle cx="40" cy="38" r="24" fill="none" stroke="#34d399" stroke-width="5" stroke-dasharray="130, 20" stroke-linecap="round"/>
        <text x="27" y="42" font-family="monospace" font-size="12" font-weight="800" fill="#34d399">96%</text>
        
        <text x="76" y="32" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Audit Confidence</text>
        <text x="76" y="48" font-family="-apple-system, sans-serif" font-size="10" fill="#34d399">✓ 3 Verified</text>
        <text x="145" y="48" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">0 Caution</text>
      </g>

      <!-- Claim 1 -->
