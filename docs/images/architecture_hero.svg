        <rect x="10" y="10" width="62" height="16" rx="4" fill="#064e3b"/>
        <text x="16" y="22" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#34d399">✓ VERIFIED</text>
        <text x="80" y="22" font-family="monospace" font-size="9" fill="#64748b">Score: 98%</text>

        <text x="10" y="42" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#e2e8f0">48.7% automated verification gain</text>
        <text x="10" y="60" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8">Source: src_101_chk_0</text>
        <text x="10" y="76" font-family="-apple-system, sans-serif" font-size="9" fill="#34d399">Exact semantic alignment.</text>
      </g>

      <!-- Claim 2 -->
      <g transform="translate(20, 235)">
        <rect x="0" y="0" width="255" height="90" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1"/>
        <rect x="10" y="10" width="62" height="16" rx="4" fill="#064e3b"/>
        <text x="16" y="22" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#34d399">✓ VERIFIED</text>
        <text x="80" y="22" font-family="monospace" font-size="9" fill="#64748b">Score: 95%</text>

        <text x="10" y="42" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#e2e8f0">100% deterministic back-tracing</text>
        <text x="10" y="60" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8">Source: src_102_chk_1</text>
        <text x="10" y="76" font-family="-apple-system, sans-serif" font-size="9" fill="#34d399">Corroborated by byte offsets.</text>
      </g>

      <!-- Trace Activity Log Snippet -->
      <g transform="translate(20, 335)">
        <rect x="0" y="0" width="255" height="100" rx="8" fill="#030712" stroke="#334155" stroke-width="1"/>
        <text x="12" y="18" font-family="monospace" font-size="9" font-weight="700" fill="#94a3b8">D1 REASONING TRACE LOGS</text>
        
        <text x="12" y="38" font-family="monospace" font-size="8.5" fill="#38bdf8">[PLANNER] 3 sub-questions</text>
        <text x="12" y="54" font-family="monospace" font-size="8.5" fill="#34d399">[VECTORIZE] 12 chunks indexed</text>
        <text x="12" y="70" font-family="monospace" font-size="8.5" fill="#cbd5e1">[SYNTH] 3 claims itemized</text>
        <text x="12" y="86" font-family="monospace" font-size="8.5" fill="#fbbf24">[AUDITOR] Audit score 96.4%</text>
