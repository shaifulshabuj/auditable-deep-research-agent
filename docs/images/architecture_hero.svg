        <text x="306" y="55" font-family="monospace" font-size="9.5" font-weight="700" fill="#6ee7b7">[src:1#0]</text>
        
        <text x="0" y="74" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">pipelines over monolithic zero-shot prompt pipelines.</text>

        <text x="0" y="106" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">2. Vector Provenance &amp; Traceability</text>
        <text x="0" y="126" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">By indexing crawl chunks with start/end byte offsets, the system</text>
        <text x="0" y="142" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">enables <tspan fill="#38bdf8" font-weight="700">100% deterministic back-tracing</tspan> directly to sources</text>

        <!-- Inline Citation Pill 2 -->
