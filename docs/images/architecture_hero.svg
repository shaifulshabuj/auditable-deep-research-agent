<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>
    
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131d31" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d1527" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="150" r="180" fill="#059669" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1000" cy="450" r="220" fill="#0284c7" opacity="0.12" filter="url(#glow)"/>

  <!-- Header Section -->
  <g transform="translate(60, 45)">
    <!-- Shield Logo Badge -->
    <rect x="0" y="0" width="44" height="44" rx="12" fill="url(#emeraldGrad)"/>
    <path d="M22 10 L32 15 L32 24 C32 30 27 34 22 36 C17 34 12 30 12 24 L12 15 Z" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M18 23 L21 26 L27 19" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Title and Subtitle -->
    <text x="56" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">The Auditable Deep Research Agent</text>
    <text x="56" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Enterprise Vector Provenance • Claim-Level Verification • Zero Speculation</text>

    <!-- Edge Badges -->
    <g transform="translate(850, 6)">
      <rect x="0" y="0" width="105" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="14" r="4" fill="#f59e0b"/>
      <text x="26" y="18" font-family="monospace" font-size="10" font-weight="600" fill="#cbd5e1">Cloudflare Edge</text>

      <rect x="115" y="0" width="115" height="28" rx="14" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <circle cx="130" cy="14" r="4" fill="#34d399"/>
      <text x="142" y="18" font-family="monospace" font-size="10" font-weight="600" fill="#a7f3d0">Vectorize v2</text>
    </g>
  </g>

