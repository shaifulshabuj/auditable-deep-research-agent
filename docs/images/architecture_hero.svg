    <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="0.5">1. STATE GRAPH ORCHESTRATOR</text>
    
    <!-- Node 1: Planner -->
